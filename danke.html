<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Bestellung bestätigt – Hansa Berufskolleg</title>
  <style>
    *{box-sizing:border-box}
    :root{--accent:#f28c00;--text:#202024;--muted:#76767f;--line:#e8e8ec;--bg:#f7f7f8}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(620px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 18px 55px rgba(0,0,0,.09)}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .brand img{width:68px;height:68px;object-fit:contain}
    .brand strong{display:block;font-size:20px}.brand span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
    .check{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#eaf7ef;color:#18794e;font-size:34px;font-weight:900;margin-bottom:18px}
    h1{margin:0 0 10px;font-size:30px;line-height:1.1}p{line-height:1.55}.lead{margin:0 0 22px;color:var(--muted)}
    .summary{border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0;background:#fcfcfd}.summary h2{font-size:16px;margin:0 0 12px}
    .row{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border-bottom:0}.row span{color:var(--muted)}.row strong{text-align:right}
    .items{display:grid;gap:9px;margin-top:12px}.item{padding:11px;border-radius:10px;background:#f5f5f7;font-size:12px;line-height:1.45}.item strong{display:block;margin-bottom:2px}
    .mailnote{font-size:13px;color:var(--muted);margin:18px 0}
    .btn{display:block;width:100%;padding:13px 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;text-align:center;font-weight:800}
    @media(max-width:600px){.page{padding:14px;align-items:flex-start}.card{margin-top:24px;padding:22px;border-radius:18px}h1{font-size:25px}.brand img{width:58px;height:58px}.row{font-size:12px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <img src="shop-logo.jpg" alt="Hansa Berufskolleg">
        <div><strong>Hansa Berufskolleg</strong><span>T-Shirt Konfigurator</span></div>
      </div>
      <div class="check" aria-hidden="true">✓</div>
      <h1>Bestellung erfolgreich gesendet</h1>
      <p class="lead">Vielen Dank. Deine Bestellung wurde übermittelt. Wir melden uns, falls noch Rückfragen bestehen.</p>
      <div id="confirmationSummary" class="summary" hidden>
        <h2>Deine Bestellung</h2>
        <div id="customerRows"></div>
        <div id="confirmationItems" class="items"></div>
      </div>
      <p class="mailnote">Die Bestellung wurde an <strong>textilien@proton.me</strong> gesendet.</p>
      <a class="btn" href="./">Neue Bestellung erstellen</a>
    </section>
  </main>
  <script>
    (function(){
      try{
        const raw=sessionStorage.getItem('hansaOrderConfirmation');
        if(!raw)return;
        const data=JSON.parse(raw);
        const box=document.getElementById('confirmationSummary');
        const rows=document.getElementById('customerRows');
        const items=document.getElementById('confirmationItems');
        const makeRow=(label,value)=>{
          const row=document.createElement('div'); row.className='row';
          const a=document.createElement('span'); a.textContent=label;
          const b=document.createElement('strong'); b.textContent=value;
          row.append(a,b); return row;
        };
        if(data.name)rows.appendChild(makeRow('Name',data.name));
        if(data.customerClass)rows.appendChild(makeRow('Klasse / Abteilung',data.customerClass));
        if(data.totalQuantity)rows.appendChild(makeRow('Gesamtmenge',String(data.totalQuantity)+' '+(data.totalQuantity===1?'Shirt':'Shirts')));
        if(Array.isArray(data.items)){
          data.items.forEach((item,i)=>{
            const el=document.createElement('div'); el.className='item';
            const t=document.createElement('strong'); t.textContent=`${i+1}. ${item.quantity}× ${item.size} · ${item.shirtColor}`;
            const m=document.createElement('span'); m.textContent=`${item.motif} · Motivfarbe: ${item.motifColor}`;
            el.append(t,m); items.appendChild(el);
          });
        }
        box.hidden=false;
        sessionStorage.removeItem('hansaOrderConfirmation');
      }catch(e){}
    })();
  </script>
</body>
</html>
